[package]
name = "yaktool"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "YakTool — Tell your computer what to do."

[dependencies]
clap = { version = "=4.5.32", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
chrono = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "0.38", features = ["fs", "process"] }
libc = "0.2"

[dev-dependencies]
tempfile = "=3.19.1"
